name: pawm-backend
services:
- name: api
  source_dir: /
  github:
    repo: Saifahmed283/Paw-M-Backend
    branch: main
  # No dockerfile_path - uses Node.js buildpack
  build_command: npm ci && npx prisma generate
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8080
  envs:
  - key: NODE_ENV
    value: production
  - key: DATABASE_URL
    value: ${db.DATABASE_URL}
  - key: JWT_SECRET
    value: ${jwt_secret}
  - key: FRONTEND_URL
    value: https://pawmclinnic.com
  # Without this, production CORS falls back to localhost-only defaults and
  # every browser request from the live site is blocked.
  - key: CORS_ORIGINS
    value: https://pawmclinnic.com,https://www.pawmclinnic.com
  - key: PORT
    value: "8080"
databases:
- name: db
  engine: PG
  version: "15"
  size: db-s-dev-database